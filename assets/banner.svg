<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="1" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="1" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: -0.5px;
        text-anchor: middle;
        animation: float 4s ease-in-out infinite;
        transform-origin: center;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #94a3b8;
        text-anchor: middle;
        animation: float 4s ease-in-out infinite;
        animation-delay: 0.5s;
        transform-origin: center;
      }
      .tag-text {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #38bdf8;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }
      .animated-circle {
        animation: twinkle 3s infinite ease-in-out;
        transform-origin: center;
      }
      .bar-glow {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="250" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1" />
  <rect width="800" height="250" rx="12" fill="url(#grid)" />
  <circle cx="400" cy="125" r="280" fill="url(#glow)" />

  <!-- Badge Pill -->
  <g transform="translate(400, 42)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text y="4" class="tag-text">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Title & Subtitle in foreground -->
  <g>
    <text x="400" y="112" class="title-text" fill="url(#textGrad)">CODE EDITORS &amp; IDES</text>
    <text x="400" y="152" class="subtitle-text">Extensible Editors &bull; LSP &bull; Cloud Workspaces &bull; AI-Native IDEs</text>
  </g>

  <!-- Glowing Accent Bar -->
  <rect class="bar-glow" x="270" y="176" width="260" height="4" rx="2" fill="url(#textGrad)" fill-opacity="0.85" />

  <!-- Dynamic Star Twinkles -->
  <circle class="animated-circle" cx="60" cy="50" r="2.5" fill="#38bdf8" style="animation-delay: 0s;" />
  <circle class="animated-circle" cx="740" cy="190" r="3" fill="#c084fc" style="animation-delay: 0.8s;" />
  <circle class="animated-circle" cx="110" cy="210" r="2" fill="#818cf8" style="animation-delay: 1.5s;" />
  <circle class="animated-circle" cx="690" cy="55" r="3" fill="#38bdf8" style="animation-delay: 2.2s;" />
  <circle class="animated-circle" cx="210" cy="75" r="2" fill="#c084fc" style="animation-delay: 1.1s;" />
</svg>
