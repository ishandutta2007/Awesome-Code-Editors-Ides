<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .pill-text {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .code-line {
        font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
      }
      
      /* Dynamic / Animated elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow 7s ease-in-out infinite reverse;
      }
      .pulse-circle {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: 950px 180px;
      }
      .cursor-blink {
        animation: cursorBlink 1s infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Matrix / Grid Pattern -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Background Orbs -->
  <circle class="pulse-circle" cx="960" cy="180" r="130" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="200" cy="80" r="90" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic / Animated Background Element: Floating Editor Card Right (Backdrop) -->
  <g class="floating-card-1" opacity="0.92">
    <!-- Mini IDE Window Mockup -->
    <rect x="800" y="65" width="340" height="230" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Window controls -->
    <circle cx="824" cy="87" r="5" fill="#ef4444" />
    <circle cx="840" cy="87" r="5" fill="#f59e0b" />
    <circle cx="856" cy="87" r="5" fill="#10b981" />
    <text x="880" y="91" fill="#64748b" font-family="monospace" font-size="11">workspace.rs — Zed / VS Code</text>

    <!-- Syntax Highlighted Lines -->
    <text x="825" y="125" class="code-line" fill="#f43f5e">fn <tspan fill="#38bdf8">init_editor_engine</tspan><tspan fill="#cbd5e1">() -&gt; Result&lt;()&gt; {</tspan></text>
    <text x="845" y="150" class="code-line" fill="#94a3b8">// LSP &amp; GPU accelerated</text>
    <text x="845" y="175" class="code-line" fill="#c084fc">let <tspan fill="#e2e8f0">lsp</tspan> = <tspan fill="#818cf8">LanguageServer</tspan>::connect();</text>
    <text x="845" y="200" class="code-line" fill="#c084fc">let <tspan fill="#e2e8f0">ai</tspan> = <tspan fill="#818cf8">AgentEngine</tspan>::spawn();</text>
    <text x="845" y="225" class="code-line" fill="#38bdf8">ai<tspan fill="#cbd5e1">.stream_inline_diff(editor);</tspan><tspan fill="#38bdf8" class="cursor-blink">|</tspan></text>
    <text x="825" y="250" class="code-line" fill="#cbd5e1">}</text>
  </g>

  <!-- Foreground Main Title & Content (Crisp, Clear, Prominent) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20" class="pill-text" fill="#38bdf8">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Code Editors &amp; IDEs</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">The definitive guide to extensible editors, cloud workspaces &amp; AI-native IDEs</text>

    <!-- Feature / Ecosystem Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="36" rx="18" fill="#111827" stroke="#475569" stroke-width="1"/>
        <text x="18" y="23" class="pill-text">⚡ High Speed</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(147, 0)">
        <rect width="150" height="36" rx="18" fill="#111827" stroke="#475569" stroke-width="1"/>
        <text x="18" y="23" class="pill-text">🧠 AI-Native IDEs</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(309, 0)">
        <rect width="145" height="36" rx="18" fill="#111827" stroke="#475569" stroke-width="1"/>
        <text x="18" y="23" class="pill-text">🌐 Cloud &amp; Web</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(466, 0)">
        <rect width="145" height="36" rx="18" fill="#111827" stroke="#475569" stroke-width="1"/>
        <text x="18" y="23" class="pill-text">🔓 100% OSS Core</text>
      </g>
    </g>

    <!-- Stats Footnote -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
      Covering 25+ Category Leaders &bull; VS Code, JetBrains, Neovim, Zed, Helix, Theia, Lapce, Sublime &amp; more
    </text>
  </g>
</svg>
