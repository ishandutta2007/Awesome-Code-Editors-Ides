<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>

    <!-- Accent Gradient Cyan-Violet -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge/Pill Border Gradient -->
    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>

    <style><![CDATA[
      .bg-grid {
        animation: gridPulse 8s ease-in-out infinite alternate;
      }
      @keyframes gridPulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }

      /* Dynamic background flow particles and waves */
      .wave-path {
        animation: waveShift 12s linear infinite alternate;
      }
      @keyframes waveShift {
        0% { stroke-dashoffset: 0; transform: translateY(0px); }
        100% { stroke-dashoffset: 120; transform: translateY(-8px); }
      }

      .floating-node-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .floating-node-3 {
        animation: float3 5s ease-in-out infinite alternate;
      }
      @keyframes float1 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-10px) translateX(6px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(12px) translateX(-8px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px) scale(0.95); }
        100% { transform: translateY(-14px) scale(1.05); }
      }

      /* Pulse indicators */
      .radar-pulse {
        animation: pulseEffect 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      @keyframes pulseEffect {
        0% { r: 3px; opacity: 1; }
        70% { r: 16px; opacity: 0.15; }
        100% { r: 20px; opacity: 0; }
      }

      /* Animated pill highlight */
      .dynamic-pill {
        transition: all 0.3s ease;
      }
      .pill-glow-1 {
        animation: pillBlink 4s ease-in-out infinite;
      }
      .pill-glow-2 {
        animation: pillBlink 4s ease-in-out 1.3s infinite;
      }
      .pill-glow-3 {
        animation: pillBlink 4s ease-in-out 2.6s infinite;
      }
      @keyframes pillBlink {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6)); }
      }

      /* Text Styles */
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .code-font {
        font-family: "JetBrains Mono", "Fira Code", Consolas, "SF Mono", Monaco, monospace;
        font-size: 13px;
        font-weight: 500;
      }
    ]]></style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Outer Cyber Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Background Grid -->
  <rect width="1200" height="360" fill="url(#cyber-grid)" class="bg-grid" />

  <!-- DYNAMIC AMBIENT BACKGROUND ELEMENTS (Behind Text and Cards) -->
  <g opacity="0.4" class="wave-path">
    <!-- Flow Curves and Waves -->
    <path d="M -100 280 C 200 320, 350 200, 600 260 C 850 320, 1000 210, 1300 240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
    <path d="M -50 320 C 250 240, 450 340, 750 280 C 1050 220, 1150 320, 1350 280" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.35" />
    <path d="M 0 100 C 300 40, 500 120, 800 60 C 1050 10, 1150 80, 1250 50" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 6" opacity="0.2" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="70" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1060" cy="290" r="160" fill="#c084fc" opacity="0.07" filter="url(#glow)" />
  <circle cx="600" cy="180" r="180" fill="#818cf8" opacity="0.04" filter="url(#glow)" />

  <!-- Left Dynamic Element: Mini IDE Window Mockup (Floating smoothly) -->
  <g class="floating-node-1" transform="translate(48, 65)">
    <!-- Terminal/Editor Card Frame -->
    <rect width="210" height="230" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="url(#pill-border)" stroke-width="1" />
    <!-- Window Header -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="68" y="22" class="code-font" fill="#64748b" font-size="11">init.lua</text>
    <line x1="0" y1="32" x2="210" y2="32" stroke="#334155" stroke-width="0.8" opacity="0.6" />

    <!-- Code Snippet Visualization -->
    <text x="16" y="58" class="code-font" fill="#c084fc">require<tspan fill="#94a3b8">(</tspan><tspan fill="#38bdf8">'lsp'</tspan><tspan fill="#94a3b8">).setup {</tspan></text>
    <text x="26" y="80" class="code-font" fill="#94a3b8">treesitter = <tspan fill="#4ade80">true</tspan>,</text>
    <text x="26" y="102" class="code-font" fill="#94a3b8">ai_copilot = <tspan fill="#38bdf8">true</tspan>,</text>
    <text x="26" y="124" class="code-font" fill="#94a3b8">latency_ms = <tspan fill="#f59e0b">0.4</tspan>,</text>
    <text x="16" y="146" class="code-font" fill="#94a3b8">}</text>

    <!-- Mini Status Bar -->
    <rect x="10" y="176" width="190" height="42" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <circle cx="26" cy="197" r="4" fill="#38bdf8" />
    <circle cx="26" cy="197" class="radar-pulse" fill="#38bdf8" />
    <text x="38" y="201" class="code-font" fill="#38bdf8" font-size="11">LSP : Ready</text>
    <text x="142" y="201" class="code-font" fill="#64748b" font-size="10">UTF-8</text>
  </g>

  <!-- Right Dynamic Element: Editor Architecture and Metrics (Floating smoothly) -->
  <g class="floating-node-2" transform="translate(942, 65)">
    <!-- Metrics Card Frame -->
    <rect width="210" height="230" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="url(#pill-border)" stroke-width="1" />
    <!-- Header -->
    <text x="18" y="25" class="code-font" fill="#94a3b8" font-size="12" font-weight="700">⚡ ENGINE STACK</text>
    <line x1="0" y1="36" x2="210" y2="36" stroke="#334155" stroke-width="0.8" opacity="0.6" />

    <!-- Stat Pill 1: GPU Render -->
    <rect x="16" y="52" width="178" height="42" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="28" y="70" class="code-font" fill="#e2e8f0" font-size="11">GPU Rendering</text>
    <text x="28" y="85" class="code-font" fill="#38bdf8" font-size="10">120 FPS Keystroke</text>

    <!-- Stat Pill 2: LSP Integration -->
    <rect x="16" y="104" width="178" height="42" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="28" y="122" class="code-font" fill="#e2e8f0" font-size="11">Tree-sitter AST</text>
    <text x="28" y="137" class="code-font" fill="#818cf8" font-size="10">Instant Grammar</text>

    <!-- Stat Pill 3: Agentic AI -->
    <rect x="16" y="156" width="178" height="42" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="28" y="174" class="code-font" fill="#e2e8f0" font-size="11">Agentic Coding</text>
    <text x="28" y="189" class="code-font" fill="#c084fc" font-size="10">Autonomous Copilots</text>

    <circle cx="182" cy="73" r="3" fill="#10b981" />
    <circle cx="182" cy="125" r="3" fill="#38bdf8" />
    <circle cx="182" cy="177" r="3" fill="#c084fc" />
  </g>

  <!-- FOREGROUND: CENTER TITLE and BADGES (Guaranteed clear and unobstructed) -->
  <g transform="translate(600, 78)" text-anchor="middle">
    <!-- Top Super-Badge / Category Pill -->
    <g class="dynamic-pill pill-glow-1">
      <rect x="-140" y="-32" width="280" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="url(#accent-grad)" stroke-width="1.2" />
      <circle cx="-118" cy="-19" r="4" fill="#38bdf8" />
      <circle cx="-118" cy="-19" class="radar-pulse" fill="#38bdf8" />
      <text x="-95" y="-14" class="code-font" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- MAIN HERO TITLE -->
    <text y="48" class="brand-title" fill="#ffffff" filter="url(#glow-subtle)">Awesome Code Editors &amp; IDEs</text>
    <text y="48" class="brand-title" fill="url(#accent-grad)">Awesome Code Editors &amp; IDEs</text>

    <!-- SUBTITLE -->
    <text y="92" class="brand-subtitle">
      A curated guide to SaaS developer platforms, cloud environments &amp; high-performance open-source IDEs
    </text>

    <!-- BOTTOM FEATURE PILLS ROW (Clean, Foreground, High-Contrast) -->
    <g transform="translate(0, 138)">
      <!-- Pill 1: SaaS and Cloud -->
      <g class="dynamic-pill pill-glow-1" transform="translate(-230, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#111827" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
        <text x="0" y="5" class="code-font" fill="#e0f2fe" text-anchor="middle" font-size="11.5">☁️ SaaS &amp; Cloud</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g class="dynamic-pill pill-glow-2" transform="translate(-75, 0)">
        <rect x="-68" y="-16" width="136" height="32" rx="16" fill="#111827" fill-opacity="0.95" stroke="#818cf8" stroke-width="1" stroke-opacity="0.7" />
        <text x="0" y="5" class="code-font" fill="#e0e7ff" text-anchor="middle" font-size="11.5">🔓 Open Source</text>
      </g>

      <!-- Pill 3: Rust and GPU -->
      <g class="dynamic-pill pill-glow-3" transform="translate(80, 0)">
        <rect x="-66" y="-16" width="132" height="32" rx="16" fill="#111827" fill-opacity="0.95" stroke="#a855f7" stroke-width="1" stroke-opacity="0.7" />
        <text x="0" y="5" class="code-font" fill="#f3e8ff" text-anchor="middle" font-size="11.5">⚡ Rust &amp; GPU</text>
      </g>

      <!-- Pill 4: Agentic AI -->
      <g class="dynamic-pill pill-glow-1" transform="translate(230, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#111827" fill-opacity="0.95" stroke="#ec4899" stroke-width="1" stroke-opacity="0.7" />
        <text x="0" y="5" class="code-font" fill="#fce7f3" text-anchor="middle" font-size="11.5">🤖 AI Native</text>
      </g>
    </g>

    <!-- Bottom subtle prompt / chevron indicator -->
    <text y="196" class="code-font" fill="#475569" font-size="11" letter-spacing="1">
      ◆ VS CODE ◆ NEOVIM ◆ ZED ◆ HELIX ◆ XCODE ◆ INTELLIJ ◆ LAPCE ◆ VOID ◆
    </text>
  </g>
</svg>
